[project]
name = "pytrade"
version = "0.1.0"
description = "Open-source learning website for Python trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "afterpython>=0.3.19",
    "niquests>=3.18.8",
    "python-dotenv>=1.2.2",
]
authors = [{name = "Stephen Yau", email = "softwareentrepreneer+pytrade@gmail.com"}]

[project.urls]
homepage = "https://pytrade.org"
repository = "https://github.com/PFund-Software-Ltd/pytrade.org"
documentation = "https://pytrade.org/doc"

[dependency-groups]
dev = [
    "juv>=0.5.0",
    "jupytext>=1.19.3",
    "jupyterlab>=4.5.7",
    "theme-darcula>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

