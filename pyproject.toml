[project]
name = "pytrade"
version = "0.1.0"
description = "Open-source learning website for Python trading"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "afterpython>=0.4.1",
    "niquests>=3.18.8",
    "python-dotenv>=1.2.4",
]
authors = [{name = "Stephen Yau", email = "softwareentrepreneer+pytrade@gmail.com"}]

[project.urls]
homepage = "https://pytrade.org"
repository = "https://github.com/PFund-Software-Ltd/pytrade.org"
documentation = "https://pytrade.org/doc"

[dependency-groups]
dev = [
    "juv>=0.5.0",
    "jupytext>=1.19.6",
    "jupyterlab>=4.6.6",
    "theme-darcula>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

