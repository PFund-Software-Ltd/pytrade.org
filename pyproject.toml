[project]
name = "pytrade"
version = "0.1.0"
description = "Open-source learning website for Python trading"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "afterpython[marimo]>=0.5.2",
]
authors = [{name = "Stephen Yau", email = "softwareentrepreneer+pytrade@gmail.com"}]

[project.urls]
homepage = "https://pytrade.org"
repository = "https://github.com/PFund-Software-Ltd/pytrade.org"
documentation = "https://pytrade.org/doc"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

